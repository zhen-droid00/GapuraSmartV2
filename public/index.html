<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3c2a">
  <meta name="description" content="Referensi Surat Edaran Gapura Smart.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/logo.png">
  <style>
    :root{color-scheme:light;--page:#e9eeeb;--surface:#fff;--subtle:#f4f7f5;--text:#19372d;--muted:#60736a;--border:#dce5df;--green:#0f3c2a;--accent:#e8f3ec}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--page);color:var(--text)}
    .app{max-width:760px;margin:auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--surface);box-shadow:0 0 60px #17382b0b}
    .header{padding:22px 24px;background:var(--green);color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:12px}h1{font-size:19px;margin:0;letter-spacing:-.4px}
    .brand p{font-size:12px;margin:5px 0 0;color:#c3d7cc}.brand img{background:white;border-radius:10px;padding:4px;object-fit:contain}
    .status-bar{display:flex;justify-content:space-between;gap:12px;padding:11px 24px;background:var(--accent);font-size:11px;font-weight:600;line-height:1.5}
    .status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#438659;margin-right:6px}
    .content-box{flex:1;min-height:0;overflow-y:auto;padding:28px 24px}
    .welcome{margin-bottom:28px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--muted)}
    h2{font-size:27px;letter-spacing:-.8px;margin:12px 0}.welcome p{font-size:14px;line-height:1.6;color:var(--muted);max-width:410px}
    .main-button{width:100%;padding:20px;text-align:left;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background 0.2s}
    .main-button:hover{background:var(--accent)}
    .circular-card{background:var(--subtle);border:1px solid var(--border);padding:20px;border-radius:14px;margin-top:16px}
    .circular-card p{margin:10px 0;font-size:14px;line-height:1.6}
    .circular-card a{display:inline-block;margin-top:10px;background:var(--green);color:white;padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px}
    .circular-card a:hover{opacity:0.9}
    footer{border-top:1px solid var(--border);padding:16px 24px;background:var(--surface);text-align:center;font-size:11px;color:var(--muted)}
    body.dark-mode{color-scheme:dark;--page:#0c1913;--surface:#15251d;--subtle:#1b2e24;--text:#e4eee7;--muted:#a9bcb0;--border:#324a3c;--green:#174c35;--accent:#20392b}
  </style>
  <title>Gapura Smart - Circular</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <img src="/logo.png" width="42" height="42" alt="">
        <div><h1>Gapura Smart</h1><p>Pusat Surat Edaran &amp; Arsip</p></div>
      </div>
      <button id="theme-btn" style="background:none;border:none;color:white;font-size:22px;cursor:pointer;" aria-label="Ubah tema">☾</button>
    </header>
    
    <div class="status-bar">
      <span><span class="status-dot"></span>Sistem Arsip Terhubung ke Google Drive</span>
      <span id="connection-status">Online</span>
    </div>

    <section class="content-box" id="content-box">
      <div class="welcome">
        <span class="eyebrow">PUSAT DOKUMEN RESMI</span>
        <h2>Surat Edaran &amp; Arsip</h2>
        <p>Akses seluruh lembar instruksi operasional dan galeri gambar pendukung langsung dari penyimpanan awan.</p>
      </div>
      
      <!-- Tombol Akses Utama Circular -->
      <button class="main-button" id="load-circular-btn">
        <span>📢 Buka Daftar Surat Edaran (Circular)</span>
        <span style="font-size: 20px;">📁</span>
      </button>

      <div id="circular-container" style="margin-top: 20px;"></div>
    </section>

    <footer>
      <p>Gapura Smart • Dokumen Resmi Terintegrasi Google Drive</p>
    </footer>
  </main>

  <script>
    // Toggle Tema Gelap / Terang
    const themeBtn = document.getElementById('theme-btn');
    const savedTheme = localStorage.getItem('gapura-theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.body.classList.add('dark-mode');
      themeBtn.textContent = '☀';
    }
    themeBtn.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      themeBtn.textContent = isDark ? '☀' : '☾';
      localStorage.setItem('gapura-theme', isDark ? 'dark' : 'light');
    });

    // Ambil dan Tampilkan Data Circular dari Server/data.json
    document.getElementById('load-circular-btn').addEventListener('click', async () => {
      const container = document.getElementById('circular-container');
      container.innerHTML = '<p style="color: #60736a; font-size: 13px;">Memuat dokumen dari server...</p>';
      
      try {
        const response = await fetch('/api/data');
        const data = await response.json();
        
        container.innerHTML = '';
        if (data.circulars && data.circulars.length > 0) {
          data.circulars.forEach(circular => {
            const card = document.createElement('div');
            card.className = 'circular-card';
            card.innerHTML = `
              <strong style="font-size: 16px; display: block; margin-bottom: 4px;">${circular.title}</strong>
              <span style="font-size: 12px; color: #60736a;">Tanggal: ${circular.date}</span>
              <p>${circular.desc}</p>
              <a href="${circular.link}" target="_blank" rel="noopener noreferrer">Buka Folder Google Drive ↗</a>
            `;
            container.appendChild(card);
          });
        } else {
          container.innerHTML = '<p>Belum ada surat edaran tersedia.</p>';
        }
      } catch (err) {
        container.innerHTML = '<p style="color: red;">Gagal memuat data surat edaran.</p>';
      }
    });
  </script>
</body>
</html>
