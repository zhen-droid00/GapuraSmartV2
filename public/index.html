<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3c2a">
  <meta name="description" content="Referensi SOP dan Circular Gapura Smart.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/logo.png">
  <style>
    :root{color-scheme:light;--page:#e9eeeb;--surface:#fff;--subtle:#f4f7f5;--text:#19372d;--muted:#60736a;--border:#dce5df;--green:#0f3c2a;--accent:#e8f3ec;--warning:#fff5d9;--warning-text:#745818}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--page);color:var(--text)}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c89127;outline-offset:3px}button{min-height:44px}button:disabled{opacity:.5;cursor:default}.app{max-width:760px;margin:auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--surface);box-shadow:0 0 60px #17382b0b}.header{padding:22px 24px;background:var(--green);color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}h1{font-size:19px;margin:0;letter-spacing:-.4px}.brand p{font-size:12px;margin:5px 0 0;color:#c3d7cc}.brand img{background:white;border-radius:10px;padding:4px;object-fit:contain}.icon-button{border:1px solid var(--border);background:var(--subtle);color:var(--text);border-radius:12px;min-width:44px;flex-shrink:0}.header .icon-button{background:#ffffff12;border-color:#ffffff35;color:white;font-size:24px}.status-bar{display:flex;justify-content:space-between;gap:12px;padding:11px 24px;background:var(--accent);font-size:11px;font-weight:600;line-height:1.5}.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#438659;margin-right:6px}#connection-status{text-align:right}.chat-box{flex:1;min-height:0;overflow-y:auto;padding:28px 24px;scroll-behavior:smooth}.welcome{margin-bottom:28px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--muted)}h2{font-size:27px;letter-spacing:-.8px;margin:12px 0}.welcome p{font-size:14px;line-height:1.6;color:var(--muted);max-width:410px}.message-wrapper{display:flex;margin:16px 0}.wrapper-user{justify-content:flex-end}.message{max-width:94%;font-size:14px;line-height:1.7;overflow-wrap:anywhere}.user-msg{max-width:85%;padding:11px 16px;background:var(--green);color:white;border-radius:16px 16px 4px 16px;white-space:pre-wrap}.ai-msg{width:100%;padding:18px;background:var(--subtle);border:1px solid var(--border);border-radius:4px 16px 16px 16px}.message h3{font-size:15px;margin:0 0 12px}.message ul{padding-left:22px}.circular-card{background:var(--surface);border:1px solid var(--border);padding:16px;border-radius:12px;margin-top:12px}.circular-card p{margin:8px 0}.circular-card a{display:inline-block;color:var(--green);font-weight:600;padding:8px 0;text-decoration:none}footer{border-top:1px solid var(--border);padding:12px 24px max(12px,env(safe-area-inset-bottom));background:var(--surface)}.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.quick-actions button{padding:6px 14px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:12px;min-height:36px;font-weight:600}.quick-actions button:hover{background:var(--accent)}.input-area{display:flex;gap:8px;align-items:center}.input-area input{min-width:0;flex:1;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--subtle);color:var(--text);font-size:16px}.send-button{width:46px;height:46px;flex-shrink:0;border:0;border-radius:12px;background:var(--green);color:white;font-size:24px}.input-hint{font-size:10px;color:var(--muted);margin:9px 0 0;line-height:1.5}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}body.dark-mode{color-scheme:dark;--page:#0c1913;--surface:#15251d;--subtle:#1b2e24;--text:#e4eee7;--muted:#a9bcb0;--border:#324a3c;--green:#174c35;--accent:#20392b;--warning:#3a321c;--warning-text:#eed698}
  </style>
  <title>Gapura Smart</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <img src="/logo.png" width="42" height="42" alt="">
        <div><h1>Gapura Smart</h1><p>Referensi operasional harian</p></div>
      </div>
      <button id="theme-btn" class="icon-button" aria-label="Aktifkan mode gelap" aria-pressed="false">☾</button>
    </header>
    
    <div class="status-bar">
      <span><span class="status-dot"></span>Utamakan Safety &amp; Security</span>
      <span id="connection-status" role="status">Online</span>
    </div>

    <section class="chat-box" id="chat-box" aria-label="Percakapan dan hasil pencarian">
      <div class="welcome">
        <span class="eyebrow">SELAMAT DATANG, GAPURA WARRIORS</span>
        <h2>Apa yang ingin kamu cek?</h2>
        <p>Temukan panduan operasional lewat chat atau buka arsip surat edaran di bawah.</p>
      </div>
    </section>

    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>

    <footer>
      <!-- 1 Tombol khusus Circular di bawah -->
      <nav class="quick-actions" aria-label="Akses cepat">
        <button id="circular-btn">📢 Buka Circular Google Drive</button>
      </nav>

      <!-- Chatbox tetap aktif -->
      <form id="search-form" class="input-area">
        <label for="user-input" class="sr-only">Pertanyaan seputar SOP</label>
        <input type="text" id="user-input" placeholder="Contoh: bagaimana jika delay?" autocomplete="off" maxlength="1000">
        <button type="submit" class="send-button" aria-label="Kirim pertanyaan">↑</button>
      </form>
      <p id="input-status" class="input-hint" role="status">Panduan ringkas • Periksa dokumen resmi sebelum digunakan</p>
    </footer>
  </main>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    function node(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function addMessage(content, sender = 'ai') {
      const wrapper = node('div', `message-wrapper wrapper-${sender}`);
      const bubble = node('div', `message ${sender === 'user' ? 'user-msg' : 'ai-msg'}`);
      if (typeof content === 'string') bubble.textContent = content;
      else bubble.append(content);
      wrapper.append(bubble);
      chatBox.append(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return wrapper;
    }

    // Fungsi tombol Circular untuk mengambil data dari backend/data.json & membuka link Google Drive
    document.getElementById('circular-btn').addEventListener('click', async () => {
      addMessage('Buka Circular Google Drive', 'user');
      
      const content = node('div');
      content.append(node('h3', '', 'Arsip Surat Edaran & Gambar (Google Drive)'));
      content.append(node('p', '', 'Daftar surat edaran resmi dan tautan penyimpanan Google Drive:'));
      
      try {
        const res = await fetch('/api/data');
        const data = await res.json();
        
        if (data.circulars && data.circulars.length > 0) {
          data.circulars.forEach(circular => {
            const card = node('article', 'circular-card');
            card.append(node('strong', '', circular.title));
            card.append(node('p', '', `Tanggal: ${circular.date}`));
            card.append(node('p', '', circular.desc));
            
            const link = node('a', '', 'Buka Folder Google Drive ↗');
            link.href = circular.link;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            card.append(link);
            
            content.append(card);
          });
        } else {
          content.append(node('p', '', 'Belum ada surat edaran tersedia.'));
        }
      } catch (err) {
        content.append(node('p', '', 'Gagal memuat data circular dari server.'));
      }
      
      addMessage(content, 'ai');
    });

    // Handle Kirim Pesan Chat / AI dengan Pembersih Teks Otomatis agar rapi
    document.getElementById('search-form').addEventListener('submit', async event => {
      event.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;
      userInput.value = '';
      addMessage(text, 'user');

      const loadingWrapper = addMessage('Sedang mencari jawaban...', 'ai');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const result = await res.json();
        loadingWrapper.remove();

        if (result.reply) {
          const content = node('div');
          content.append(node('h3', '', 'Jawaban Asisten AI'));
          
          // Membersihkan format markdown mentah agar tampil rapi dan berbentuk paragraf
          const formattedText = result.reply
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>');

          const p = node('div');
          p.style.lineHeight = '1.7';
          p.innerHTML = formattedText.replace(/\n/g, '<br>');
          
          content.append(p);
          addMessage(content, 'ai');
        } else {
          addMessage(result.error || 'Maaf, terjadi kesalahan.', 'ai');
        }
      } catch (err) {
        loadingWrapper.remove();
        addMessage('Gagal terhubung ke server AI.', 'ai');
      }
    });

    // Tema Gelap / Terang
    const themeBtn = document.getElementById('theme-btn');
    const savedTheme = localStorage.getItem('gapura-theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.body.classList.add('dark-mode');
      themeBtn.textContent = '☀';
    }
    themeBtn.addEventListener('click', () => {
      const isDark = document.body.classList.toggle('dark-mode');
      themeBtn.textContent = isDark ? '☀' : '☾';
      localStorage.setItem('gapura-theme', isDark ? 'dark' : 'light');
    });
  </script>
</body>
</html>
