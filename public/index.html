<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f3c2a">
  <meta name="description" content="Referensi SOP, checklist, dan surat edaran Gapura Smart.">
  <title>Gapura Smart Frontend</title>
  
  <style>
    :root{color-scheme:light;--page:#e9eeeb;--surface:#fff;--subtle:#f4f7f5;--text:#19372d;--muted:#60736a;--border:#dce5df;--green:#0f3c2a;--accent:#e8f3ec;--warning:#fff5d9;--warning-text:#745818}
    *{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--page);color:var(--text)}button,input,select{font:inherit}button,a,input,select{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c89127;outline-offset:3px}button{min-height:44px}button:disabled{opacity:.5;cursor:default}.app{max-width:760px;margin:auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--surface);box-shadow:0 0 60px #17382b0b}.header{padding:22px 24px;background:var(--green);color:white;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}h1{font-size:19px;margin:0;letter-spacing:-.4px}.brand p{font-size:12px;margin:5px 0 0;color:#c3d7cc}.icon-button{border:1px solid var(--border);background:var(--subtle);color:var(--text);border-radius:12px;min-width:44px;flex-shrink:0}.header .icon-button{background:#ffffff12;border-color:#ffffff35;color:white;font-size:24px}.status-bar{display:flex;justify-content:space-between;gap:12px;padding:11px 24px;background:var(--accent);font-size:11px;font-weight:600;line-height:1.5}.status-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#438659;margin-right:6px}#connection-status{text-align:right}.chat-box{flex:1;min-height:0;overflow-y:auto;padding:28px 24px;scroll-behavior:smooth}.welcome{margin-bottom:28px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.4px;color:var(--muted)}h2{font-size:27px;letter-spacing:-.8px;margin:12px 0}.welcome p{font-size:14px;line-height:1.6;color:var(--muted);max-width:410px}.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.topic-button{padding:16px;text-align:left;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font-size:13px;font-weight:600;line-height:1.5}.topic-button:hover,.quick-actions button:hover{background:var(--accent)}.message-wrapper{display:flex;margin:16px 0}.wrapper-user{justify-content:flex-end}.message{max-width:94%;font-size:14px;line-height:1.7;overflow-wrap:anywhere}.user-msg{max-width:85%;padding:11px 16px;background:var(--green);color:white;border-radius:16px 16px 4px 16px;white-space:pre-wrap}.ai-msg{width:100%;padding:18px;background:var(--subtle);border:1px solid var(--border);border-radius:4px 16px 16px 16px}.message h3{font-size:15px;margin:0 0 12px}.message ul{padding-left:22px}.message .topic-grid{margin-top:12px}
    .typing-indicator { display: flex; gap: 4px; padding: 4px; align-items: center; justify-content: center; width: 40px; height: 16px; }
    .typing-dot { width: 6px; height: 6px; background: var(--muted); border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    .source-note{font-size:12px;line-height:1.6;background:var(--warning);color:var(--warning-text);padding:12px;border-radius:10px;margin:0 0 16px}.source-note p{margin:0}.checklist-item{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border);cursor:pointer}.checklist-item input{width:20px;height:20px;flex-shrink:0;accent-color:var(--green);margin-top:3px}.checklist-item:has(input:checked){color:var(--muted)}.session-controls{display:grid;gap:8px;margin:12px 0;font-size:12px}.session-controls input,.session-controls select{width:100%;min-height:44px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}.small-button{padding:8px 12px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;font-size:12px}.progress{font-size:12px;color:var(--muted);margin:12px 0}.circular-card{background:var(--surface);border:1px solid var(--border);padding:16px;border-radius:12px;margin-top:12px}.circular-card p{margin:8px 0}.circular-card time{font-size:12px;color:var(--muted)}.circular-card a{display:inline-block;color:var(--text);font-weight:600;padding:8px 0}footer{border-top:1px solid var(--border);padding:12px 24px max(12px,env(safe-area-inset-bottom));background:var(--surface)}.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.quick-actions button{padding:6px 12px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text);font-size:12px;min-height:36px}.input-area{display:flex;gap:8px;align-items:center}.input-area input{min-width:0;flex:1;border:1px solid var(--border);border-radius:12px;padding:14px;background:var(--subtle);color:var(--text);font-size:16px}.send-button{width:46px;height:46px;flex-shrink:0;border:0;border-radius:12px;background:var(--green);color:white;font-size:24px}.input-hint{font-size:10px;color:var(--muted);margin:9px 0 0;line-height:1.5}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}body.dark-mode{color-scheme:dark;--page:#0c1913;--surface:#15251d;--subtle:#1b2e24;--text:#e4eee7;--muted:#a9bcb0;--border:#324a3c;--green:#174c35;--accent:#20392b;--warning:#3a321c;--warning-text:#eed698}@media(max-width:480px){.header{padding:16px}.status-bar{padding:10px 16px}.chat-box{padding:24px 16px}footer{padding-left:12px;padding-right:12px}.topic-button{padding:12px;font-size:12px}h2{font-size:25px}.ai-msg{padding:14px}.message{max-width:100%}}@media(prefers-reduced-motion:reduce){.chat-box{scroll-behavior:auto}}
    .brand img{background:white;border-radius:10px;padding:4px;object-fit:contain}
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="brand"><img src="https://placehold.co/42x42/0f3c2a/ffffff?text=GS" width="42" height="42" alt=""><div><h1>Gapura Smart</h1><p>Client App</p></div></div>
      <button id="theme-btn" class="icon-button" aria-label="Aktifkan mode gelap" aria-pressed="false">☾</button>
    </header>
    <div class="status-bar"><span><span class="status-dot"></span>Utamakan Safety &amp; Security</span><span id="connection-status" role="status">Online</span></div>
    
    <section class="chat-box" id="chat-box" aria-label="Percakapan dan hasil pencarian">
      <div class="welcome">
        <span class="eyebrow">SELAMAT DATANG, GAPURA WARRIORS</span>
        <h2>Apa yang ingin kamu cek?</h2>
        <p>Temukan panduan operasional atau lanjutkan checklist persiapanmu.</p>
        <div class="topic-grid" id="welcome-topics">Menghubungkan ke Server API...</div>
      </div>
    </section>
    
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
    
    <footer>
      <nav class="quick-actions" aria-label="Akses cepat">
        <button data-action="menu">Semua topik</button>
        <button data-action="checklist">📋 Checklist</button>
        <button data-action="circular">📢 Circular</button>
      </nav>
      <form id="search-form" class="input-area">
        <label for="user-input" class="sr-only">Pertanyaan seputar SOP</label>
        <input type="text" id="user-input" placeholder="Contoh: bagaimana jika delay?" autocomplete="off" maxlength="1000">
        <button type="submit" class="send-button" aria-label="Kirim pertanyaan">↑</button>
      </form>
      <p id="input-status" class="input-hint" role="status">Frontend Client terhubung ke Node.js Server</p>
    </footer>
  </main>

  <script>
    'use strict';
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const inputStatus = document.getElementById('input-status');

    let checklistDatabase = [];
    let sopDatabase = [];
    let circularDatabase = [];
    let allTopics = [];

    const storage = {
      read(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } },
      write(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; } }
    };

    const savedSessions = storage.read('gapura-checklists-v2', {});
    const sessions = savedSessions && typeof savedSessions === 'object' && !Array.isArray(savedSessions) ? savedSessions : {};
    const checklistCards = new Map();
    let activeSession = storage.read('gapura-active-session', '');

    function node(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }
    
    function scrollToLatest() { chatBox.scrollTop = chatBox.scrollHeight; }

    function addMessage(content, sender = 'ai') {
      const wrapper = node('div', `message-wrapper wrapper-${sender}`);
      const bubble = node('div', `message ${sender === 'user' ? 'user-msg' : 'ai-msg'}`);
      if (typeof content === 'string') bubble.textContent = content;
      else bubble.append(content);
      wrapper.append(bubble);
      chatBox.append(wrapper);
      scrollToLatest();
      return wrapper;
    }

    function formatAIResponse(text) {
      const div = document.createElement('div');
      let html = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\*(.*?)\*/g, '<i>$1</i>').replace(/\n/g, '<br>');
      div.innerHTML = html;
      return div;
    }

    async function askGeminiAIViaBackend(userQuery) {
      const typingWrapper = node('div', `message-wrapper wrapper-ai`);
      const typingBubble = node('div', `message ai-msg`);
      typingBubble.innerHTML = `<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
      typingWrapper.append(typingBubble);
      chatBox.append(typingWrapper);
      scrollToLatest();

      try {
          // SEKARANG kita memanggil server Backend kita sendiri, BUKAN API Google langsung!
          const response = await fetch('/api/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: userQuery })
          });
          
          typingWrapper.remove();
          const result = await response.json();
          
          if (!response.ok) throw new Error(result.error || 'Server Error');
          
          const content = node('div');
          const aiNote = node('div', 'source-note');
          aiNote.innerHTML = '<strong>✨ Dijawab oleh Backend AI Server</strong><p>Jawaban ini dihasilkan oleh Server API berdasarkan standar umum.</p>';
          content.append(aiNote, formatAIResponse(result.reply));
          addMessage(content);
          
      } catch (error) {
          typingWrapper.remove();
          addMessage(`❌ Gagal terhubung ke AI Server: ${error.message}`);
      }
    }

    function topicButtons(topics) {
      const grid = node('div', 'topic-grid');
      topics.forEach(topic => {
        const button = node('button', 'topic-button', topic.title);
        button.type = 'button';
        button.addEventListener('click', () => quickReply(topic.trigger, topic.title));
        grid.append(button);
      });
      return grid;
    }

    function normalize(text) { return text.toLocaleLowerCase('id-ID').normalize('NFKC').replace(/[^\p{L}\p{N}]+/gu, ' ').trim().replace(/\s+/g, ' '); }

    function getLevenshteinDistance(a, b) {
      if (a.length === 0) return b.length;
      if (b.length === 0) return a.length;
      const matrix = [];
      for (let i = 0; i <= b.length; i++) matrix[i] = [i];
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          if (b.charAt(i - 1) === a.charAt(j - 1)) matrix[i][j] = matrix[i - 1][j - 1];
          else matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
        }
      }
      return matrix[b.length][a.length];
    }

    function findTopics(text) {
      const query = normalize(text);
      if (!query) return [];
      const queryWords = query.split(' ');
      let exact = allTopics.filter(topic => [topic.trigger, ...(topic.keywords || [])].some(word => normalize(word) === query));
      if (exact.length) return exact;
      let partial = allTopics.filter(topic => [topic.trigger, ...(topic.keywords || [])].some(word => (` ${query} `).includes(` ${normalize(word)} `)));
      if (partial.length) return partial;
      return allTopics.filter(topic => {
        const keywords = [topic.trigger, ...(topic.keywords || [])].map(normalize);
        return queryWords.some(qWord => {
          if (qWord.length < 4) return false;
          return keywords.some(kWord => getLevenshteinDistance(qWord, kWord) <= 2);
        });
      });
    }

    function renderTopic(topic) {
        if(topic.items) {
           // Fitur checklist disederhanakan untuk contoh frontend
           const content = node('div');
           content.append(node('h3', '', topic.title));
           const list = node('ul');
           topic.items.forEach(item => { list.append(node('li', '', item.text)); });
           content.append(list);
           addMessage(content);
        } else {
           const content = node('div');
           content.append(node('h3', '', topic.title));
           const answer = node('div'); answer.innerHTML = topic.answer;
           content.append(answer);
           addMessage(content);
        }
    }

    function processBotResponse(text) {
      const found = findTopics(text);
      if (found.length === 1) return renderTopic(found[0]);
      if (found.length === 0) { askGeminiAIViaBackend(text); return; }
      
      const content = node('div');
      content.append(node('h3', '', 'Ada beberapa topik yang sesuai'), topicButtons(found));
      addMessage(content);
    }

    function quickReply(trigger, title) { addMessage(title, 'user'); processBotResponse(trigger); }

    document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => quickReply(button.dataset.action, button.textContent)));
    document.getElementById('search-form').addEventListener('submit', event => {
      event.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;
      userInput.value = '';
      addMessage(text, 'user'); processBotResponse(text);
    });

    async function initApp() {
      try {
        // Mengambil data dari REST API Backend kita, bukan dari file lokal langsung
        const response = await fetch('/api/data');
        if (!response.ok) throw new Error('Gagal mengambil data dari server');
        const data = await response.json();
        
        checklistDatabase = data.checklists;
        sopDatabase = data.sops;
        circularDatabase = data.circulars;
        allTopics = [...checklistDatabase, ...sopDatabase];
        
        document.getElementById('welcome-topics').replaceWith(topicButtons(allTopics));
      } catch (error) {
        console.error(error);
        document.getElementById('welcome-topics').replaceWith(node('p', 'source-note', 'Gagal memuat API dari Backend Server.'));
      }
    }

    initApp();

    const themeBtn = document.getElementById('theme-btn');
    function setTheme(dark) {
      document.body.classList.toggle('dark-mode', dark);
      themeBtn.textContent = dark ? '☀' : '☾';
    }
    setTheme(window.matchMedia('(prefers-color-scheme: dark)').matches);
    themeBtn.addEventListener('click', () => setTheme(!document.body.classList.contains('dark-mode')));
  </script>
</body>
</html>
